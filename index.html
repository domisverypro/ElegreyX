<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElegreyX - Software & Plugins</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-screen">
        <div class="loading-logo">
            <div class="logo-icon"></div>
            <span>ElegreyX</span>
        </div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

    <div id="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <span>ElegreyX</span>
                </div>
                <button class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <nav class="main-nav">
                <div class="nav-section">
                    <h3 class="nav-title">Resources</h3>
                    <ul>
                        <li class="active" data-section="plugins"><i class="fas fa-puzzle-piece"></i> Plugins</li>
                        <li data-section="presets"><i class="fas fa-sliders-h"></i> Presets</li>
                        <li data-section="software"><i class="fas fa-download"></i> Software</li>
                        <li data-section="tutorials"><i class="fas fa-video"></i> Tutorials</li>
                    </ul>
                </div>
                
                <div class="nav-section">
                    <h3 class="nav-title">Platform</h3>
                    <ul>
                        <li class="platform-filter active" data-platform="all"><i class="fas fa-layer-group"></i> All</li>
                        <li class="platform-filter" data-platform="windows"><i class="fab fa-windows"></i> Windows</li>
                        <li class="platform-filter" data-platform="mac"><i class="fab fa-apple"></i> Mac</li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="content-area">
            <header class="mobile-header">
                <button class="sidebar-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="mobile-channel-info">
                    <h2 class="channel-title">Plugins</h2>
                </div>
            </header>

            <div class="content-section active" id="plugins-section">
                <div class="section-header">
                    <h1>After Effects Plugins</h1>
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="all">All</button>
                        <button class="category-tab" data-category="animation">Animation</button>
                        <button class="category-tab" data-category="effects">Effects</button>
                        <button class="category-tab" data-category="3d">3D</button>
                        <button class="category-tab" data-category="utility">Utility</button>
                    </div>
                </div>

                <div class="plugins-grid">
                    <!-- Plugins will be loaded here by JavaScript -->
                </div>
            </div>

            <div class="content-section" id="presets-section">
                <div class="section-header">
                    <h1>Presets & Transitions</h1>
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="all">All</button>
                        <button class="category-tab" data-category="transitions">Transitions</button>
                        <button class="category-tab" data-category="shakes">Shakes</button>
                        <button class="category-tab" data-category="text">Text Animations</button>
                        <button class="category-tab" data-category="color">Color Presets</button>
                    </div>
                </div>

                <div class="presets-grid">
                    <!-- Presets will be loaded here by JavaScript -->
                </div>
            </div>

            <div class="content-section" id="software-section">
                <div class="section-header">
                    <h1>Software Downloads</h1>
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="all">All</button>
                        <button class="category-tab" data-category="adobe">Adobe</button>
                        <button class="category-tab" data-category="3d">3D Software</button>
                        <button class="category-tab" data-category="editing">Editing</button>
                    </div>
                </div>

                <div class="software-grid">
                    <!-- Software will be loaded here by JavaScript -->
                </div>
            </div>

            <div class="content-section" id="tutorials-section">
                <div class="section-header">
                    <h1>Video Tutorials</h1>
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="all">All</button>
                        <button class="category-tab" data-category="beginner">Beginner</button>
                        <button class="category-tab" data-category="advanced">Advanced</button>
                        <button class="category-tab" data-category="tips">Quick Tips</button>
                    </div>
                </div>

                <div class="tutorials-grid">
                    <!-- Tutorials will be loaded here by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
